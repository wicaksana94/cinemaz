[build]
  command = "npm run build"
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
    audits = []

[[redirects]]
  from = "/api/tmdb/*"
  to = "/.netlify/edge-functions/tmdb-gateway/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
